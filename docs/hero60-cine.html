<script>
const W=1920,H=1080;
const FPS=60,DUR=60,FRAMES=FPS*DUR;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

// palette — video-spec.md
const C={

// shot boundaries frames
const SHOTS=[
  {id:0, s:0,   e:72,   name:'OM'},

  {id:7, s:2760,e:3180, name:'TEARDOWN'},
  {id:8, s:3180,e:3600, name:'CTA'},

function shotAt(f){
  for(const s of SHOTS) if(f>=s.s && f<s.e) return s;
  return SHOTS[SHOTS.length-1];
}

// palette #08090b #20b8cd #9df0f8 — OM tokens — ink #16181a bone #efece5 dark #08090b
// motion spring 420/28/0.9 via spring01 — deterministic seeded xorshift32(fnv1a('solari-chow-hero60 v1')) — NO Math.random / Date.now
// W1920 H1080 FPS60 FRAMES3600 — contract window.__cineFrame(i)->data:image/jpeg 0.97 __cineMeta {1920,1080,60,3600} __sceneReady
function fnv1a(str){ let h=2166136261>>>0; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); } return h>>>0; }
const __SEED = fnv1a('solari-chow-hero60 v1');
function xorshift32(n){ n = (n + __SEED) >>>0; n ^= n<<13; n ^= n>>>17; n ^= n<<5; return (n>>>0)/4294967296; }
function xorshift(n){ return xorshift32(n); }
// spring approx — stiffness 420 damping 28 mass .9 deterministic
function spring01(u){
  const w0=21.6, zeta=0.72, wd=w0*Math.sqrt(1-zeta*zeta);
  if(u>=1) return 1;
  const tt=u*1.4;
  const env=Math.exp(-zeta*w0*tt);
  const osc=Math.cos(wd*tt)+(zeta/Math.sqrt(1-zeta*zeta))*Math.sin(wd*tt);
  return 1 - env*osc;
}
function ease(t){ t=Math.max(0,Math.min(1,t)); return t*t*(3-2*t); }
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

// helpers
function bgGradient(){
  const g=ctx.createRadialGradient(W*0.7,H*0.18,0,W*0.7,H*0.18,900);
  g.addColorStop(0,'rgba(32,184,205,0.18)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const g2=ctx.createRadialGradient(W*0.2,H*0.9,0,W*0.2,H*0.9,800);
  g2.addColorStop(0,'rgba(7,126,147,0.22)'); g2.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g2; ctx.fillRect(0,0,W,H);
  const lg=ctx.createLinearGradient(0,0,0,H);
  lg.addColorStop(0,'#0a0b0d'); lg.addColorStop(0.6,'#08090b'); lg.addColorStop(1,'#07080a');
  ctx.fillStyle=lg; ctx.globalAlpha=0.9; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
}
function pseudoBearing(alpha, time){
  ctx.save(); ctx.globalAlpha=alpha;
  const cx=W*0.62, cy=H*0.48, R=340;
  const frame=(time*60)|0;
  ctx.fillStyle='#121418';
  ctx.beginPath(); ctx.arc(cx,cy,R+20,0,Math.PI*2); ctx.arc(cx,cy,R-58,0,Math.PI*2,true); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.09)'; ctx.lineWidth=1.2; ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(cx,cy,R-48,0,Math.PI*2); ctx.stroke();
  const env=ctx.createRadialGradient(cx-110, cy-140, 20, cx, cy, R+30);
  env.addColorStop(0,'rgba(255,255,255,0.22)'); env.addColorStop(0.35,'rgba(157,240,248,0.09)'); env.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=env; ctx.beginPath(); ctx.arc(cx,cy,R+20,0,Math.PI*2); ctx.arc(cx,cy,R-58,0,Math.PI*2,true); ctx.fill();
  const rim=ctx.createRadialGradient(cx+160, cy+120, 10, cx, cy, R+40);
  rim.addColorStop(0,'rgba(156,194,255,0.14)'); rim.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rim; ctx.beginPath(); ctx.arc(cx,cy,R+22,0,Math.PI*2); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.strokeStyle='rgba(255,255,255,0.068)'; ctx.lineWidth=0.7;
  for(let k=0;k<42;k++){
    const seed=frame*104729 + k*7919 + 0x9e37;
    const rr=R-56 + xorshift(seed)*68;
    const a0=xorshift(seed+1)*Math.PI*0.18;
    const a1=Math.PI*2 - xorshift(seed+2)*Math.PI*0.18;
    ctx.beginPath(); ctx.arc(cx,cy,rr,a0,a1); ctx.stroke();
  }
  ctx.restore();
  for(let k=0;k<90;k++){
    const s=frame*30011 + k*24677 + 1;
    const ang=xorshift(s)*Math.PI*2, rad=R-40 + (xorshift(s+1)-0.5)*42;
    const x=cx+rad*Math.cos(ang), y=cy+rad*Math.sin(ang);
    const r=1.2 + xorshift(s+2)*2.2;
    const v=xorshift(s+3);
    ctx.fillStyle=v<0.5 ? 'rgba(255,255,255,0.075)' : 'rgba(0,0,0,0.10)';
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  ctx.strokeStyle='rgba(255,255,255,0.052)'; ctx.lineWidth=0.6;
  for(let k=0;k<36;k++){
    const s=frame*50021 + k*11003 + 2;
    const ang=xorshift(s)*Math.PI*2, rad=R-30 + xorshift(s+1)*36;
    const len=18 + xorshift(s+2)*34;
    const x0=cx+rad*Math.cos(ang), y0=cy+rad*Math.sin(ang);
    const x1=x0+len*Math.cos(ang+Math.PI/2), y1=y0+len*Math.sin(ang+Math.PI/2);
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  }
  for(let i=0;i<96;i++){
    const a=i/96*Math.PI*2 + time*0.15;
    const ca=Math.cos(a), sa=Math.sin(a);
    const r0=R+2, r1=R+20;
    const w0=4.2, w1=2.6;
    const px=-sa, py=ca;
    const x0a=cx+ca*r0+px*w0, y0a=cy+sa*r0+py*w0;
    const x0b=cx+ca*r0-px*w0, y0b=cy+sa*r0-py*w0;
    const x1a=cx+ca*r1+px*w1, y1a=cy+sa*r1+py*w1;
    const x1b=cx+ca*r1-px*w1, y1b=cy+sa*r1-py*w1;
    ctx.fillStyle='rgba(18,20,24,0.95)';
    ctx.beginPath(); ctx.moveTo(x0a,y0a); ctx.lineTo(x1a,y1a); ctx.lineTo(x1b,y1b); ctx.lineTo(x0b,y0b); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(106,112,120,0.95)';
    ctx.beginPath(); ctx.moveTo(x1a,y1a); ctx.lineTo(x1b,y1b); ctx.lineTo(x1b- ca*3, y1b - sa*3); ctx.lineTo(x1a- ca*3, y1a - sa*3); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.11)'; ctx.lineWidth=0.5; ctx.stroke();
  }
  for(let i=0;i<40;i++){
    const a=i/40*Math.PI*2 + time*0.6;
    const rr=260; const x=cx+rr*Math.cos(a), y=cy+rr*Math.sin(a);
    ctx.save(); ctx.translate(x,y); ctx.rotate(a+Math.PI/2);
    const grad=ctx.createLinearGradient(-9,0,9,0);
    grad.addColorStop(0,'#a8adb4'); grad.addColorStop(0.5,'#eef1f6'); grad.addColorStop(1,'#5e636a');

    ctx.strokeStyle='rgba(0,0,0,0.22)'; ctx.lineWidth=0.9; ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.42)';
    ctx.beginPath(); ctx.ellipse(-3.2, -6, 2.2, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.10)';
    ctx.beginPath(); ctx.ellipse(0,0,9,18,0,-0.35,0.35); ctx.fill();
    ctx.restore();

  for(let i=0;i<32;i++){
    const a=i/32*Math.PI*2 + time*0.6;
    const rr=310; const x=cx+rr*Math.cos(a), y=cy+rr*Math.sin(a);
    ctx.save(); ctx.translate(x,y); ctx.rotate(a);
    const rg=ctx.createLinearGradient(-14,0,14,0);
    rg.addColorStop(0,'#6b7078'); rg.addColorStop(0.5,'#c8d2dc'); rg.addColorStop(1,'#5a5f67');

    ctx.strokeStyle='rgba(0,0,0,0.22)'; ctx.lineWidth=0.7; ctx.strokeRect(-14,-6,28,12);
    ctx.fillStyle='rgba(255,255,255,0.38)'; ctx.fillRect(-14,-6,28,2.2);
    ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.fillRect(-14,3.5,28,1.2);
    ctx.restore();
  }
  ctx.fillStyle='rgba(8,9,11,0.58)';
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R+34, -0.35, 0.65); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(184,189,196,0.35)'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(-0.35)*(R+34), cy+Math.sin(-0.35)*(R+34)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(0.65)*(R+34), cy+Math.sin(0.65)*(R+34)); ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,0.22)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(cx,cy,R-48, -0.35, 0.65); ctx.stroke();
  ctx.restore();
}
function drawOM(x,y, scale, alpha){

function frameToCaption(f){

// cursor — deterministic humanize via xorshift
function drawCursor(cx,cy, frame, clicking, alpha){
  const jx = (xorshift(frame*9991)-0.5)*2.2;
  const jy = (xorshift(frame*104729+1)-0.5)*2.2;
  const x=cx+jx, y=cy+jy;
  ctx.save(); ctx.globalAlpha=alpha;
  // drop shadow
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.moveTo(x+1.2,y+1.2); ctx.lineTo(x+1.2,y+16.7); ctx.lineTo(x+5.4,y+13.2); ctx.lineTo(x+8.3,y+19.8); ctx.lineTo(x+10.8,y+18.6); ctx.lineTo(x+7.9,y+12.2); ctx.lineTo(x+12.8,y+12.0); ctx.closePath(); ctx.fill();
  ctx.fillStyle= clicking ? '#20b8cd' : '#ffffff';
  ctx.strokeStyle='#0a0a0b'; ctx.lineWidth=1.1;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+15.5); ctx.lineTo(x+4.2,y+12); ctx.lineTo(x+7.1,y+18.4); ctx.lineTo(x+9.6,y+17.3); ctx.lineTo(x+6.7,y+11); ctx.lineTo(x+11.6,y+10.8); ctx.closePath(); ctx.fill(); ctx.stroke();

}
