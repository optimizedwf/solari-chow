<script>

// seeded xorshift32(fnv1a(PROMPT)>>>0) — deterministic, no wall-clock
function fnv1a(str){
  let h=2166136261>>>0;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
  return h>>>0;
}
function xorshift32(n){
  n^=n<<13; n^=n>>>17; n^=n<<5; return (n>>>0)/4294967296;
}
const SEED=fnv1a('solari-chow-quote-15s v1')>>>0;
function seeded(i){ return xorshift32((SEED + i*0x9e3779b1)>>>0); }
function spring01(u){
  const w0=21.6, zeta=0.72, wd=w0*Math.sqrt(1-zeta*zeta);
  if(u>=1) return 1;
  const tt=u*1.4;
  const env=Math.exp(-zeta*w0*tt);
  const osc=Math.cos(wd*tt)+(zeta/Math.sqrt(1-zeta*zeta))*Math.sin(wd*tt);
  return 1 - env*osc;
}
function ease(t){ t=Math.max(0,Math.min(1,t)); return t*t*(3-2*t); }
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function bgGradient(){

  ctx.fillStyle=g2; ctx.fillRect(0,0,W,H);
  const lg=ctx.createLinearGradient(0,0,0,H);
  lg.addColorStop(0,'#0a0b0d'); lg.addColorStop(0.6,'#08090b'); lg.addColorStop(1,'#07080a');
  ctx.fillStyle=lg; ctx.globalAlpha=0.9; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
}
function drawCursor(cx,cy,frame,clicking,grabbing,alpha){

  ctx.fillStyle='rgba(0,0,0,0.35)';
